name: Deploy keyboard site and speech collector

on:
  push:
    branches: [main]
    paths:
      - "speech-collector/frontend/**"
      - ".github/workflows/speech-collector-pages.yml"
      - "site/**"
      - "rime/**"
      - "tools/build_site_lexicon.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: speech-collector-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speech-collector/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: speech-collector/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /Ruianese_Typing_Method/collect/
          VITE_API_BASE_URL: ${{ vars.SPEECH_COLLECTOR_API_BASE_URL }}

      - name: Assemble site (keyboard site at /, collector at /collect/)
        working-directory: .
        run: |
          python3 tools/build_site_lexicon.py
          mkdir -p _site/keyboard
          cp -R site/. _site/
          cp -R speech-collector/frontend/dist _site/collect
          (cd rime && zip -qr ../_site/ruianese-rime.zip .)
          # The site briefly lived at /keyboard/; send old links home.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="../"><a href="../">瑞安話輸入法</a>' > _site/keyboard/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
