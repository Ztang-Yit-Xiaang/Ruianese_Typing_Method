name: Deploy speech collector and keyboard site

on:
  push:
    branches: [main]
    paths:
      - "speech-collector/frontend/**"
      - ".github/workflows/speech-collector-pages.yml"
      - "site/**"
      - "rime/**"
      - "tools/build_site_lexicon.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: speech-collector-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speech-collector/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: speech-collector/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /Ruianese_Typing_Method/
          VITE_API_BASE_URL: ${{ vars.SPEECH_COLLECTOR_API_BASE_URL }}

      - name: Add keyboard site at /keyboard/
        working-directory: .
        run: |
          python3 tools/build_site_lexicon.py
          mkdir -p speech-collector/frontend/dist/keyboard
          cp -R site/. speech-collector/frontend/dist/keyboard/
          (cd rime && zip -qr ../speech-collector/frontend/dist/keyboard/ruianese-rime.zip .)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: speech-collector/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
